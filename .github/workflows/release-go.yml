#name: Go Release
# Disabled until maintainer approval (retargeted from the removed cargo
# semantic-release pipeline). Enable by uncommenting; tag v* to publish.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - name: Build leankg + leankg-embed (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          (cd go && go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../out/ ./cmd/leankg ./cmd/leankg-embed)
      - name: Archive
        run: tar -czf leankg-${{ matrix.goos }}-${{ matrix.goarch }}.tgz -C out leankg leankg-embed
      - uses: softprops/action-gh-release@v2
        with:
          files: leankg-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
