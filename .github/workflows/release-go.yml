name: Go Release
# Retargeted from the removed cargo semantic-release pipeline: builds a 4-target
# CGO_ENABLED=0 matrix and attaches binaries to the GitHub Release for the
# version you pass. No automatic version bumping — keep go/cmd/leankg/VERSION
# in sync with what you release (a future release-notes automation can restore
# the old pipeline's polish).
on:
  # Manual only until the maintainer opts in: a tag-push trigger would publish
  # releases unprompted (the cargo pipeline it replaces was approval-gated by
  # semantic-release PRs). Switch to `push: tags: ["v*"]` to automate.
  #
  # Manual dispatch requires an explicit version: GITHUB_REF_NAME is the BRANCH
  # on workflow_dispatch, so using it would stamp binaries with "main".
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (matches go/cmd/leankg/VERSION, e.g. 0.31.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - name: Build leankg + leankg-embed (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p out
          (cd go && go build -ldflags "-s -w -X main.version=${{ inputs.version }}" -o ../out/ ./cmd/leankg ./cmd/leankg-embed)
      - name: Archive
        run: tar -czf leankg-${{ matrix.goos }}-${{ matrix.goarch }}.tgz -C out leankg leankg-embed
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: leankg-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
