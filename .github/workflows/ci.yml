name: CI

on:
  push:
    branches: [main]
    # Release Please merges only bump version metadata; the release PR
    # already ran CI. Skipping avoids a duplicate ~5m suite on every release.
    paths-ignore:
      - 'CHANGELOG.md'
      - 'manifest.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-target-

      - name: Run unit tests
        run: cargo test --lib

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y

      - name: Run clippy
        run: cargo clippy --all -- -D warnings

  ui-v2:
    name: UI v2 Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui-v2/package-lock.json

      - name: Install and build ui-v2
        working-directory: ui-v2
        run: npm ci && npm run build

  graph-ui:
    name: Graph UI tests + build (Track E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: graph-ui/package-lock.json

      - name: Install
        working-directory: graph-ui
        run: npm ci

      - name: Test (vitest)
        working-directory: graph-ui
        run: npm test

      - name: Build
        working-directory: graph-ui
        run: npm run build

      - name: Verify embeddable 3d shell
        shell: bash
        run: |
          test -f graph-ui/dist/index.html
          grep -q 'assets/' graph-ui/dist/index.html
