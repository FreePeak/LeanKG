name: CI

on:
  push:
    branches: [main]
    # Release Please merges only bump version metadata; the release PR
    # already ran CI. Skipping avoids a duplicate ~5m suite on every release.
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    branches: [main]

jobs:
  go-engine:
    name: Go Engine (build + vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      - name: Build
        run: cd go && go build ./...
      - name: Vet
        run: cd go && go vet ./...
      - name: Test (sqlite; PG tests skip without LEANKG_TEST_PG_URL)
        run: cd go && go test ./... -count=1 -timeout 300s
