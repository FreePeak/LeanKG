name: CI

on:
  push:
    branches: [main]
    # Release Please merges only bump version metadata; the release PR
    # already ran CI. Skipping avoids a duplicate ~5m suite on every release.
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'cmd/leankg/VERSION'
      - 'internal/mcp/server.go'
  pull_request:
    branches: [main]

# One self-hosted Mac, one runner slot (labels `self-hosted,macOS,ARM64,leankg`),
# and every job in this file needs it. Without a group, a push that arrives while
# a suite is running queues a second full run behind it — measured 2026-10-17:
# four runs (12 jobs, ~2.5 h of work) queued behind one 4-job run, and GitHub
# reports that as "queued", indistinguishable from a hung runner. Superseded
# pushes are dropped instead, so the slot always drains toward the current tip.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on the owner's self-hosted macOS runner (labels below). Pull
# requests from forks default to a GitHub-hosted runner, but a fork controls
# this file in its own PR and can name the runner's labels, so this expression
# is not the protection: the repository requires maintainer approval for every
# outside contributor's workflow run (Settings > Actions > Fork pull request
# workflows). Read a fork PR's workflow diff before approving it. The
# portfolio registry is pointed
# at the job's temp dir: `leankg index` (TTFV gate) otherwise registers a
# project in the runner account's real ~/.leankg/portfolio.db on every run.
env:
  LEANKG_PORTFOLIO_DB: ${{ github.workspace }}/../ci-portfolio.db

jobs:
  dual-engine:
    name: Dual Engine (sqlite + live pgvector)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    # 25m is a ceiling on a hang, not a budget: measured wall time on the
    # self-hosted Mac is 1m20s-1m30s (run 39003423067), and the gate step
    # carries its own 20m cap. Same reason as go-engine's cap — an uncapped
    # wedged job holds the repo's only runner slot.
    timeout-minutes: 25
    # Same two budgets the go-engine job carries (#488). This job also runs the
    # sqlite suite on the same self-hosted Mac, so it was exposed to the same
    # cold-spawn flake: measured on #512, `TestRunPatternToleratesShapeDrift`
    # deadlined at 10s while every other package in the job was green.
    env:
      LEANKG_TEST_ASTGREP_TIMEOUT: 120s
      LEANKG_TEST_LSP_TIMEOUT: 120s
      LEANKG_TEST_SIDECAR_TIMEOUT: 120s
    # The PostgreSQL + pgvector tier was 100% unexecuted in every CI run: 14 test
    # files gate behind LEANKG_TEST_PG_URL, no workflow ever set it, and the
    # gate script's own documentation named a compose file nobody started.
    # Measured 2026-10-11 on the self-hosted runner's docker: pgvector 18 comes
    # up, `make dual-engine` passes build+vet, the sqlite suite, the PG store
    # tests AND end-to-end index/embed/query on both engines.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      - name: Start pgvector (the repo's own compose service)
        run: docker compose -f scripts/pgvector.compose.yml up -d
      - name: Wait for the vector extension
        run: |
          export LEANKG_TEST_PG_URL="postgres://postgres:postgres@localhost:5433/leankg?sslmode=disable"
          for i in $(seq 1 60); do
            psql "$LEANKG_TEST_PG_URL" -At -c "select 1" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "pgvector never became reachable" >&2
          exit 1
      - name: Enable the pgvector extension
        run: |
          export LEANKG_TEST_PG_URL="postgres://postgres:postgres@localhost:5433/leankg?sslmode=disable"
          psql "$LEANKG_TEST_PG_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      # The gate script itself; it builds, vets, runs the sqlite suite, the PG
      # store tests and both-engine e2e, and drops only the schema it created.
      - name: Dual-engine acceptance gate
        run: make dual-engine
        timeout-minutes: 20
      # Teardown belongs to the step that started the fixture. Measured
      # 2026-10-17: run 38989829770 started pgvector on the self-hosted runner
      # and never stopped it — `leankg-pg-500mb` was still holding port 5433
      # four hours later, until the next run reused the name. `if: always()`
      # so a failed or timed-out gate still removes the container; the plain
      # `down` keeps the `leankg-pgdata-500mb` volume (only `-v` wipes it).
      - name: Stop pgvector
        if: always()
        run: docker compose -f scripts/pgvector.compose.yml down
  go-engine:
    name: Go Engine (build + vet + test)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    # 20m is a ceiling on a hang, not a budget: measured wall time on the
    # self-hosted Mac is ~2m10s (05:18:54-05:21:02 on 2026-10-17), and the suite
    # carries its own -timeout 300s. It matters because the runner has ONE slot:
    # an uncapped wedged job holds the whole queue, and every later run sits in
    # "queued" — which reads exactly like a broken runner.
    timeout-minutes: 20

    # Two packages spawn external binaries under a fixed 10s budget
    # (ast-grep, gopls). A COLD spawn was measured at 32s/37s on idle
    # hardware, so 10s is already below the real cold cost; on this
    # self-hosted Mac, shared with the operator's own work, it deadlined
    # twice (run 38115374687: internal/astgrep + internal/lsp failed while
    # every other package — including the change under test — was green, and
    # the next run on main passed). Job-level so BOTH Test steps inherit it;
    # the shipped defaults are unchanged, so a well-behaved runner is
    # unaffected.
    env:
      LEANKG_TEST_ASTGREP_TIMEOUT: 120s
      LEANKG_TEST_LSP_TIMEOUT: 120s
      LEANKG_TEST_SIDECAR_TIMEOUT: 120s
    steps:
      - uses: actions/checkout@v4
      # GOCACHE is pinned into the job's temp dir, so setup-go's cache key
      # covers THIS repo's build cache (~20 MB) instead of the runner
      # account's whole ~/Library/Caches/go-build — which on the self-hosted
      # Mac is the entire machine's, measured 8.5 GB. A cache of that size
      # costs more to download (~7.5 GB at 11.6 MB/s = 11 min) than the
      # cold-cache build it replaces (measured 1m01s for the full suite), so
      # every job on this runner timed out in `setup-go` before reaching a
      # step of its own.
      # The pin changes the cached paths but not the key (go version +
      # go.sum), so a key hit still restored the machine-wide module cache
      # (2.4-3.4 GB, 2.5-5.5 min, and cancelled mid-download on PR #458).
      # The self-hosted Mac keeps its module and build caches on disk, so
      # setup-go's cache is pure overhead there: it is on for GitHub-hosted
      # runners (fork PRs) only.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      - name: Build (tstree tag — exercises the CGO tier first)
        run: go build -tags tstree ./...
      # Two packages spawn external binaries under a fixed 10s budget
      # (ast-grep, gopls). On this self-hosted Mac, shared with whatever the
      # operator is running, a COLD first spawn was measured at 32s/37s and
      # deadlined twice (run 38115374687: internal/astgrep + internal/lsp
      # both failed while every other package, including the change under
      # test, was green). The env knobs widen those two budgets only; a
      # well-behaved runner is unaffected because the default is unchanged.
      - name: Test (tstree tag)
        run: go test -tags tstree ./... -count=1 -timeout 300s
      # Tidy scans tagged files too (smacker is imported only under tstree);
      # a drifted go.mod/go.sum fails here instead of at release time.
      - name: Tidy guard
        run: cp go.mod /tmp/go.mod.bak && cp go.sum /tmp/go.sum.bak && go mod tidy && diff -q go.mod /tmp/go.mod.bak && diff -q go.sum /tmp/go.sum.bak
      # Every failure this release path has had was a job silently skipping, so
      # these three invariants are each pinned to a defect that actually shipped.
      - name: Release workflow guards
        run: |
          # This job runs on a SELF-HOSTED runner (its env carries
          # LEANKG_PORTFOLIO_DB, a path in ~/actions-runners), so "the ubuntu
          # image ships PyYAML" does not hold: `python3` here is Homebrew's
          # 3.15, which has no PyYAML, and PEP 668 refuses to install into it.
          # That is how run 38360152395 went red on a commit that only deleted
          # an unreferenced file — the guard must never be the reason CI fails
          # for the wrong cause. Build the interpreter the guard needs instead
          # of assuming one on PATH.
          python3 -m venv "$RUNNER_TEMP/guardvenv"
          "$RUNNER_TEMP/guardvenv/bin/python" -m pip install --quiet pyyaml
          "$RUNNER_TEMP/guardvenv/bin/python" scripts/release_workflow_guards.py
          # ci.yml's own guards (concurrency group, per-job caps, the npm-cache
          # rule every job on this one runner depends on). Same venv: no second
          # PyYAML install, and the workflow that carries the invariants is the
          # one that asserts them — so the next edit that drops a timeout has to
          # argue with CI instead of queueing every later run behind a hang.
          "$RUNNER_TEMP/guardvenv/bin/python" scripts/ci_workflow_guards.py
      # The release artifacts are CGO_ENABLED=0 (release.yml), and the
      # default build claims to be CGO-free. Runner images default to cgo=1,
      # so without this step a stray vendored C source (e.g. a grammar's .c
      # without its build tag) breaks the shipped shape while CI stays green.
      - name: Build (CGO_ENABLED=0 — the release shape)
        run: CGO_ENABLED=0 go build ./...
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vet (tstree)
        run: go vet -tags tstree ./...
      - name: Test (sqlite; PG tests skip without LEANKG_TEST_PG_URL)
        run: go test ./... -count=1 -timeout 300s

  # Issue #280: CI-timed published TTFV. Measures the Go cold happy path
  # (build -> index pinned fixture -> serve bind -> first query over REST and
  # over MCP) end-to-end and FAILS over 300s. The budget assert lives in
  # scripts/ttfv_smoke.sh so the number is a measurement, not a timeout: the
  # generous job cap (12m > 5m budget + cold-cache build worst case) means a
  # breach surfaces as a failed gate with the number printed, never as an
  # opaque runner timeout. GOCACHE/GOMODCACHE are warm on the self-hosted
  # Mac's disk (setup-go's cache is off there, see go-engine) and via
  # setup-go's cache on GitHub-hosted runners; a
  # cold miss is still covered by the budget (macOS cold-cache measurement:
  # 17.8s total, 16.1s of it the build).
  ttfv:
    name: Cold TTFV Gate (Go, < 300s)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # GOCACHE pinned for the same reason as the go-engine job above (and
      # this job is where the 8.5 GB cache was first written): the TTFV gate
      # measures a COLD happy path, so a cache it does not need is pure
      # download time against a 12m job cap.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      - name: Timed cold happy path
        run: bash scripts/ttfv_smoke.sh --json ttfv.json
        timeout-minutes: 10
      # FR-PLG-7 / PRD T2: the same happy path, measured from the user's side,
      # was written against the Rust CLI (leankg init, leankg mcp-http,
      # search_code) and had therefore never run once. It now uses only verbs
      # the shipped binary has and gates on the 300s budget, so the published
      # "first query ≤ 5 min" claim is a measurement rather than an aspiration.
      - name: Quickstart happy path (timed)
        run: bash scripts/quickstart_smoke.sh
        timeout-minutes: 10
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttfv-go-cold
          path: ttfv.json
          if-no-files-found: warn

  frontend:
    name: Frontend (ui-v2 e2e + dashboard unit)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    # 25m covers the worst measured wall time (~5m50s, run 39003423067) with
    # room for a cold embed, on the one runner slot this repo has. Same reason
    # as go-engine's cap: a hang must fail the job, never hold the queue.
    timeout-minutes: 25
    # The e2e suite never ran anywhere before this job existed: the default
    # playwright config starts a vite dev server and assumes a backend on
    # :8080, no workflow had a frontend job, and a bare local run skipped
    # everything (the specs self-skip when no server answers) or fell over on
    # a missing browser. 2026-10-11 measured 11/11 specs passing against the
    # EMBEDDED build that `go build` ships — see playwright.embedded.config.ts.
    # The job builds the real binary, serves it with --ui, and tests the SPA
    # it actually ships, so a ui-v2 change that breaks the shipped UI fails CI
    # instead of never being noticed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      # No `cache: npm` on the self-hosted runner, for the reason setup-go
      # already documents in go-engine: the cache save/restore talks to GitHub's
      # cache service and is pure overhead on a Mac that keeps ~/.npm on disk.
      # Measured 2026-10-17: with the cache on, `setup-node` spent 3m40s-4m38s
      # per run restoring a 216 MB tarball at ~1 MB/s (runs 38999592068,
      # 39001709926, 39002635228, 39002760777) against a `npm ci` that completes
      # in 24s from the local cache — and the same post-job save is what hung
      # dsh-mux's runner. A GitHub-hosted runner (fork PRs) keeps it, through a
      # SECOND setup-node step: `cache` is only read when it is non-empty, but
      # the cache key is the HASH OF THE LOCK FILES, so a step that restores
      # nothing is the only way to leave the self-hosted path with neither the
      # 216 MB restore nor setup-node's checksum over two package-lock.json.
      - name: Set up Node (self-hosted — no dependency cache)
        if: runner.environment != 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Node (GitHub-hosted — with the npm cache)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui-v2/package-lock.json
            ui-dashboard/package-lock.json
      - name: Go build (the binary whose embed the suite tests)
        run: CGO_ENABLED=0 go build -o /tmp/leankg ./cmd/leankg
      - name: npm ci (playwright + vitest deps)
        run: npm ci
        working-directory: ui-v2
      - name: Index the pinned fixture (the same one the TTFV gate uses)
        run: |
          cp -R examples/go-api-service /tmp/e2e-fixture
          rm -rf /tmp/e2e-fixture/.leankg
          /tmp/leankg index /tmp/e2e-fixture
      - name: Serve the embedded UI over the fixture project
        run: |
          /tmp/leankg serve --http 127.0.0.1:9801 --ui 127.0.0.1:9802 --project /tmp/e2e-fixture > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9802/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9802/ >/dev/null
      - name: Unit tests (vitest)
        run: npm test
        working-directory: ui-v2
      - name: E2E against the embedded build
        run: E2E=1 FRONTEND_URL=http://127.0.0.1:9802 BACKEND_URL=http://127.0.0.1:9802 npx playwright test --config playwright.embedded.config.ts
        working-directory: ui-v2
      # ui-v2's single-file build, rebuilt and diffed against what the binary
      # embeds. Measured 2026-10-11: a fresh build produced index-Cpk7crab.js /
      # index-DNKHeHYu.css while internal/web/embed still shipped
      # index-CwcVR9A7.js / index-BN6mYsjm.css — the SPA every user got was not
      # built from the source in the tree, and nothing noticed, because the e2e
      # suite above tests the embed AS SHIPPED (so a stale embed can only ever
      # pass). This step is what makes that suite mean something.
      - name: ui-v2 embed drift gate
        run: |
          npm --prefix ui-v2 ci
          make go-ui-assets-check
      # The dashboard SPA is the other shipped frontend (what `leankg
      # dashboard` serves). Its 6 unit-test files / 45 tests ran in NO CI job
      # before this one; measured 2026-10-11 — all green in 1.2s, so the only
      # reason they were unguarded was that nothing invoked them.
      - name: Dashboard unit tests (vitest)
        run: npm ci --silent && npm test
        working-directory: ui-dashboard
      # The Makefile calls this "(CI gate)", but no workflow invoked it — so a
      # dashboard source change could land without its embed, and
      # `leankg dashboard` would keep serving the previous SPA while the
      # stamp claimed otherwise. It is one sha256 tree hash: ~1s.
      - name: Dashboard embed drift gate
        run: make go-ui-dashboard-check
