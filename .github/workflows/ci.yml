name: CI

on:
  push:
    branches: [main]
    # Release Please merges only bump version metadata; the release PR
    # already ran CI. Skipping avoids a duplicate ~5m suite on every release.
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'cmd/leankg/VERSION'
      - 'internal/mcp/server.go'
  pull_request:
    branches: [main]

# Jobs run on the owner's self-hosted macOS runner (labels below). Pull
# requests from forks default to a GitHub-hosted runner, but a fork controls
# this file in its own PR and can name the runner's labels, so this expression
# is not the protection: the repository requires maintainer approval for every
# outside contributor's workflow run (Settings > Actions > Fork pull request
# workflows). Read a fork PR's workflow diff before approving it. The
# portfolio registry is pointed
# at the job's temp dir: `leankg index` (TTFV gate) otherwise registers a
# project in the runner account's real ~/.leankg/portfolio.db on every run.
env:
  LEANKG_PORTFOLIO_DB: ${{ github.workspace }}/../ci-portfolio.db

jobs:
  go-engine:
    name: Go Engine (build + vet + test)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    steps:
      - uses: actions/checkout@v4
      # GOCACHE is pinned into the job's temp dir, so setup-go's cache key
      # covers THIS repo's build cache (~20 MB) instead of the runner
      # account's whole ~/Library/Caches/go-build — which on the self-hosted
      # Mac is the entire machine's, measured 8.5 GB. A cache of that size
      # costs more to download (~7.5 GB at 11.6 MB/s = 11 min) than the
      # cold-cache build it replaces (measured 1m01s for the full suite), so
      # every job on this runner timed out in `setup-go` before reaching a
      # step of its own.
      # The pin changes the cached paths but not the key (go version +
      # go.sum), so a key hit still restored the machine-wide module cache
      # (2.4-3.4 GB, 2.5-5.5 min, and cancelled mid-download on PR #458).
      # The self-hosted Mac keeps its module and build caches on disk, so
      # setup-go's cache is pure overhead there: it is on for GitHub-hosted
      # runners (fork PRs) only.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      - name: Build (tstree tag — exercises the CGO tier first)
        run: go build -tags tstree ./...
      - name: Test (tstree tag)
        run: go test -tags tstree ./... -count=1 -timeout 300s
      # Tidy scans tagged files too (smacker is imported only under tstree);
      # a drifted go.mod/go.sum fails here instead of at release time.
      - name: Tidy guard
        run: cp go.mod /tmp/go.mod.bak && cp go.sum /tmp/go.sum.bak && go mod tidy && diff -q go.mod /tmp/go.mod.bak && diff -q go.sum /tmp/go.sum.bak
      # Every failure this release path has had was a job silently skipping, so
      # these three invariants are each pinned to a defect that actually shipped.
      - name: Release workflow guards
        run: |
          # ubuntu runners ship PyYAML, but a guard must never be the reason CI
          # goes red for the wrong cause — so it installs the one import if the
          # image ever stops providing it.
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 scripts/release_workflow_guards.py
      # The release artifacts are CGO_ENABLED=0 (release.yml), and the
      # default build claims to be CGO-free. Runner images default to cgo=1,
      # so without this step a stray vendored C source (e.g. a grammar's .c
      # without its build tag) breaks the shipped shape while CI stays green.
      - name: Build (CGO_ENABLED=0 — the release shape)
        run: CGO_ENABLED=0 go build ./...
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Vet (tstree)
        run: go vet -tags tstree ./...
      - name: Test (sqlite; PG tests skip without LEANKG_TEST_PG_URL)
        run: go test ./... -count=1 -timeout 300s

  # Issue #280: CI-timed published TTFV. Measures the Go cold happy path
  # (build -> index pinned fixture -> serve bind -> first query over REST and
  # over MCP) end-to-end and FAILS over 300s. The budget assert lives in
  # scripts/ttfv_smoke.sh so the number is a measurement, not a timeout: the
  # generous job cap (12m > 5m budget + cold-cache build worst case) means a
  # breach surfaces as a failed gate with the number printed, never as an
  # opaque runner timeout. GOCACHE/GOMODCACHE are warm on the self-hosted
  # Mac's disk (setup-go's cache is off there, see go-engine) and via
  # setup-go's cache on GitHub-hosted runners; a
  # cold miss is still covered by the budget (macOS cold-cache measurement:
  # 17.8s total, 16.1s of it the build).
  ttfv:
    name: Cold TTFV Gate (Go, < 300s)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","macOS","ARM64","leankg"]') }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      # GOCACHE pinned for the same reason as the go-engine job above (and
      # this job is where the 8.5 GB cache was first written): the TTFV gate
      # measures a COLD happy path, so a cache it does not need is pure
      # download time against a 12m job cap.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: go.sum
        env:
          GOCACHE: ${{ runner.temp }}/go-build
      - name: Timed cold happy path
        run: bash scripts/ttfv_smoke.sh --json ttfv.json
        timeout-minutes: 10
      - name: Upload timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttfv-go-cold
          path: ttfv.json
          if-no-files-found: warn
