name: Release
# Semantic versioning for the Go engine, end to end, in ONE workflow run:
#
#   merge to main -> release-please opens/updates the release PR
#   merge the release PR -> same run: tag vX.Y.Z + GitHub Release
#                        -> then build the 4 CGO-free tarballs and attach them
#
# Why one run and not a `push: tags: [v*]` follower: release-please pushes the
# tag with the run's GITHUB_TOKEN, and GitHub suppresses workflow runs caused by
# GITHUB_TOKEN writes. That is not theory here — the Rust-era chain died exactly
# this way: v0.28.1, v0.29.0 and v0.30.0 were tagged by leankg-release[bot] and
# shipped with ZERO assets because the tag-triggered release workflow never ran.
# So the asset jobs hang off the release-please job's outputs instead.
#
# `workflow_dispatch` re-publishes binaries for a release that already exists
# (a failed/partial publish), which is the only case where no new version is cut.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Re-publish binaries for an existing release (e.g. 0.31.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Cut the version (release-please)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Downstream jobs read the version straight off `plan` (or the manual input)
  # rather than through an intermediate resolver job: job-to-job outputs are the
  # one link in this chain that has silently produced empty values before, which
  # is how v0.31.0 ended up tagged with no binaries. `plan` itself is a plain
  # `${{ steps.<id>.outputs.<name> }}` passthrough of release-please's own
  # outputs, and that path is proven by the v0.31.1 release.
  #
  # On workflow_dispatch (re-publishing an existing release) `plan` is skipped,
  # so `inputs.version` supplies the value instead.
  verify:
    name: Version consistency gate
    needs: plan
    if: ${{ needs.plan.outputs.version != '' || inputs.version != '' }}
    env:
      VERSION: ${{ needs.plan.outputs.version || inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version || inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      # ci.yml skips release-metadata commits, so the three version copies are
      # otherwise never compared on the exact commit that gets shipped.
      - name: Tag, go/cmd/leankg/VERSION and the MCP serverInfo must agree
        env:
          VERSION: ${{ needs.plan.outputs.version || inputs.version }}
        run: |
          set -euo pipefail
          stamp="$(awk '{print $1}' go/cmd/leankg/VERSION)"
          if [ "$stamp" != "$VERSION" ]; then
            echo "::error file=go/cmd/leankg/VERSION::stamped $stamp but releasing v$VERSION"
            exit 1
          fi
          cd go && go test ./internal/mcp/ -run TestVersionMatchesReleaseStamp -count=1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [plan, verify]
    if: ${{ needs.plan.outputs.version != '' || inputs.version != '' }}
    env:
      VERSION: ${{ needs.plan.outputs.version || inputs.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version || inputs.version }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum
      # CGO_ENABLED=0 is the shipped shape (ci.yml guards it). The asset name is
      # a contract: internal/update matches `leankg-<goos>-<goarch>.tgz` exactly
      # and requires leankg + leankg-embed at the archive root, stamped with the
      # version it is verifying.
      - name: Build leankg + leankg-embed
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.plan.outputs.version || inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          (cd go && go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../out/ ./cmd/leankg ./cmd/leankg-embed)
          tar -czf "leankg-${GOOS}-${GOARCH}.tgz" -C out leankg leankg-embed
          sha256sum "leankg-${GOOS}-${GOARCH}.tgz" > "leankg-${GOOS}-${GOARCH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            leankg-*.tgz
            leankg-*.sha256
          if-no-files-found: error

  publish:
    name: Attach binaries to the release
    needs: [plan, build]
    if: ${{ needs.plan.outputs.version != '' || inputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Upload assets and the SHA256 table
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version || inputs.version }}
          TAG: v${{ needs.plan.outputs.version || inputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" leankg-*.tgz --clobber
          # `--latest` moves the pointer `leankg update` follows. Only claim it
          # when this version is at least the current latest: re-publishing the
          # binaries of an older release must not send every client backwards.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          latest_flag=(--latest)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            latest_flag=()
            echo "keeping $latest as latest (republishing older $TAG without assets moving the pointer)"
          fi
          # internal/update reads a checksum from the API digest or, failing
          # that, from a release-body line that also names the asset. One line
          # per platform, each carrying its own filename.
          {
            echo ""
            echo "## SHA256"
            echo ""
            cat leankg-*.sha256
          } > checksums.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            { gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body
              cat checksums.md; } > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            # workflow_dispatch for a tag that has no release yet.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file checksums.md "${latest_flag[@]}"
          fi
          # A draft is invisible to `releases/latest`, which is what
          # `leankg update` polls (v0.27.0 sat drafted with assets nobody got).
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${latest_flag[@]}"
          # Fail loudly if the release we just targeted still has no assets:
          # silent skips are what made three releases unusable before.
          n="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets | length')"
          if [ "${n:-0}" -lt 4 ]; then
            echo "::error::$TAG has $n asset(s); expected 4 platform tarballs"
            exit 1
          fi

  # A module that lives in a subdirectory is versioned by a directory-prefixed
  # tag: the module proxy only ever sees `go/vX.Y.Z` for
  # github.com/FreePeak/LeanKG/go. The root `vX.Y.Z` tag release-please cuts is
  # invisible to it, which is why the module resolved only as a pseudo-version
  # and pkg.go.dev 404'd the unversioned URL. Mirroring each release tag is what
  # makes `go get github.com/FreePeak/LeanKG/go@latest` (and `go install
  # github.com/FreePeak/LeanKG/go/cmd/leankg@latest`, and the published docs)
  # resolve a real version. Lightweight tag: no identity to configure, and the
  # proxy reads it the same.
  modtag:
    name: Publish the go/ module tag
    needs: plan
    # Only when a version was actually cut; a workflow_dispatch re-publish has
    # no new version to mirror, and `plan` is skipped there.
    if: ${{ needs.plan.outputs.version != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version }}
      - name: Tag go/v${{ needs.plan.outputs.version }} at the release commit
        env:
          MOD_TAG: go/v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads --tags origin "refs/tags/$MOD_TAG" >/dev/null 2>&1; then
            echo "::error::$MOD_TAG already exists; refusing to move a published module version"
            exit 1
          fi
          git tag "$MOD_TAG"
          git push origin "$MOD_TAG"
