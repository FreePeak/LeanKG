name: Update LeanKG on Release

on:
  push:
    branches: [main]
    # Indexes ./src only — skip version-only / docs / CI pushes.
    # release:published rarely fires here (GITHUB_TOKEN-created releases
    # do not re-trigger workflows); keep it for manually published releases.
    paths:
      - 'src/**'
  release:
    types: [published]

jobs:
  update-graph:
    runs-on: ubuntu-latest
    # `leankg index` writes into PostgreSQL (Postgres is the only engine, D4) —
    # without a live instance it fails with "connection refused".
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: leankg
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leankg"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      LEANKG_PG_URL: postgresql://postgres:postgres@localhost:5433/leankg
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build LeanKG
        run: cargo build --release

      - name: Index and push to LeanKG server
        env:
          LEANKG_TOKEN: ${{ secrets.LEANKG_TOKEN }}
          LEANKG_HOST: ${{ vars.LEANKG_HOST || 'https://leankg.internal' }}
          LEANKG_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
        run: |
          SERVICE_NAME="${{ github.event.repository.name }}"
          VERSION="${{ github.sha }}"

          echo "Indexing $SERVICE_NAME (env: $LEANKG_ENV, version: $VERSION)"

          ./target/release/leankg index ./src \
            --env "$LEANKG_ENV" \
            --service-name "$SERVICE_NAME" \
            --version "$VERSION"

          if [ -n "$LEANKG_TOKEN" ]; then
            echo "Pushing to $LEANKG_HOST..."
            ./target/release/leankg push \
              --remote "$LEANKG_HOST" \
              --token "$LEANKG_TOKEN" \
              --env "$LEANKG_ENV"
          else
            echo "LEANKG_TOKEN not set, skipping push"
          fi
