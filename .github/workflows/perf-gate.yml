# Perf regression gate (CORE-6 / H8): fail when a deterministic workload
# regresses >PERF_GATE_PCT% vs committed benchmarks/baseline.json.
# Storage: sqlite only — no Postgres service container, no Docker.
name: perf-gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    env:
      PORT: "9797"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Collect workload metrics + compare against baseline
        run: |
          set -euo pipefail
          METRICS=$(bash scripts/run_perf_workload.sh "$RUNNER_TEMP/perf-fixture" \
                    "$PWD/target/release/leankg" "$PORT")
          echo "metrics: $METRICS"
          bash scripts/perf_gate.sh \
            --baseline benchmarks/baseline.json \
            --metrics "$METRICS" | tee perf-gate-output.txt
          grep -q "^PASS:" perf-gate-output.txt
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-output
          path: perf-gate-output.txt

  # Tier 2/3: nested-repo + mega-graph live harness. Complements the perf
  # gate: proves scale *behaviour* (nested discovery, noise skip, mega-mode
  # refusal, verb envelope) at a deterministic fixture size, not just timing.
  scale-harness:
    runs-on: ubuntu-latest
    needs: perf-gate
    env:
      LEANKG_BIN: ${{ github.workspace }}/target/release/leankg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Run scale + nested-repo harness
        run: bash scripts/scale_harness.sh --port 9798
