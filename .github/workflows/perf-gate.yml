# Perf regression gate (CORE-6 / H8): fail when a deterministic workload
# regresses >PERF_GATE_PCT% vs committed benchmarks/baseline.json.
# NOTE: uses a Postgres SERVICE container for CI only — local dev always uses
# the remote PG via LEANKG_PG_URL (never Docker).
name: perf-gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: leankg
          POSTGRES_PASSWORD: leankg
          POSTGRES_DB: leankg
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LEANKG_PG_URL: postgres://leankg:leankg@localhost:5432/leankg
      PORT: "9797"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enable pgvector extension
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U leankg -d leankg \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Build release binary
        run: cargo build --release
      - name: Collect workload metrics + compare against baseline
        run: |
          set -euo pipefail
          METRICS=$(bash scripts/run_perf_workload.sh "$RUNNER_TEMP/perf-fixture" \
                    "$PWD/target/release/leankg" "$PORT")
          echo "metrics: $METRICS"
          bash scripts/perf_gate.sh \
            --baseline benchmarks/baseline.json \
            --metrics "$METRICS" | tee perf-gate-output.txt
          grep -q "^PASS:" perf-gate-output.txt
      - name: Upload gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-output
          path: perf-gate-output.txt
