<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Outer dashed hex frame -->
  <polygon points="32,6 54,18 54,46 32,58 10,46 10,18"
           fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>

  <!-- Inner solid hex frame -->
  <polygon points="32,11 49,20 49,44 32,53 15,44 15,20"
           fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>

  <!-- Triangle connecting 3 nodes (graph structure) -->
  <polygon points="32,18 46,42 18,42"
           fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>

  <!-- 3 graph nodes on triangle vertices -->
  <circle cx="32" cy="18" r="4" fill="url(#cyan)" stroke="#fff" stroke-width="0.8"/>
  <circle cx="46" cy="42" r="4" fill="url(#cyan)" stroke="#fff" stroke-width="0.8"/>
  <circle cx="18" cy="42" r="4" fill="url(#cyan)" stroke="#fff" stroke-width="0.8"/>

  <!-- Subtle inner hex accent -->
  <polygon points="32,24 41,29 41,38 32,43 23,38 23,29"
           fill="none" stroke="#22d3ee" stroke-width="0.5" opacity="0.3"/>
</svg>
