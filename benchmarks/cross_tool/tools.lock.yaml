# Tool pins for the cross-tool benchmark (FR-ZCP-08). Hand-maintained; the corpus
# pins live in repos.lock.yaml (generated by `make lock`).
#
# Any value still marked PLACEHOLDER blocks a real run: plan.py --dry-run reports
# it, and `make run-*` refuses to start. Fill these in on the run host, then re-run
# `make dry-run`.

context_mode:
  # Newest stable tag from `git ls-remote --tags https://github.com/mksglu/context-mode`
  # (2026-11-24). Pre-release tags (v2.0.0-next.*) are excluded.
  repo: https://github.com/mksglu/context-mode.git
  tag: v2.2.2
  # Peeled commit of the annotated tag (the ^{} line from ls-remote).
  sha: 65d228b6a522a0add2387ead3883e243ac0cec0b
  # Install per README "Install" (Claude Code uses a plugin; the bench does NOT use the
  # plugin, because its hooks would load into the arm). npm package version = plugin version.
  # NOT VERIFIED: the npm registry query timed out on 2026-11-24. Check before a real run.
  npm_install: "npm i -g context-mode@2.2.2"
  # Launch the bundled MCP server; mcp_config for the arm uses this path.
  # The file is server.mjs in the package root (plugins/claude-code/server.mjs at the tag).
  server_path: "$(npm root -g)/context-mode/server.mjs"
  # engines.node in plugins/claude-code/package.json at the tag.
  node_min: "24.15.0"

claude_code:
  # PLACEHOLDER: the CLI version the arms run under. benchmarks/cross_tool/Makefile
  # says 2.1.201 was verified on 2026-07-23; that is not re-verified here.
  version: PLACEHOLDER

model:
  # PLACEHOLDER: exact model id for `claude -p --model`. An empty MODEL means the CLI
  # default, which is not a pinned model and must not be used for a real run.
  id: PLACEHOLDER
