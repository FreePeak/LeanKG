[package]
name = "leankg"
version = "0.26.0"
edition = "2021"
description = "Lightweight Knowledge Graph for AI-Assisted Development"
license = "Apache-2.0"
repository = "https://github.com/FreePeak/LeanKG"
homepage = "https://github.com/FreePeak/LeanKG"
documentation = "https://github.com/FreePeak/LeanKG"
readme = "README.md"
keywords = ["knowledge-graph", "ai"]
categories = ["command-line-utilities", "data-structures"]

[lib]
crate-type = ["rlib"]

# Query-only MCP (RO) — thin wrapper over leankg mcp-http/mcp-stdio
[[bin]]
name = "leankg-mcp"
path = "src/bin/leankg_mcp.rs"

# Pipeline worker (index / embed / watch / status)
[[bin]]
name = "leankg-worker"
path = "src/bin/leankg_worker.rs"

[features]
default = ["lang-extras"]
# Enable vector retrieval + cross-encoder rerank + adaptive KG traversal.
# Adds fastembed (embedding + reranker inference via ONNX). Vectors are stored
# in Postgres pgvector (HNSW index on `embedding_vectors`).
# Off by default to keep the default binary slim.
embeddings = ["dep:fastembed", "dep:ort", "dep:tokenizers", "dep:ndarray"]
# Non-core language grammars. Off in the slim Docker build (--no-default-features)
# so only core languages (go/ts/py/rust/java/kotlin/bash/ruby/php/perl/r/elixir/
# swift/c/cpp/objc/dart) are compiled into the MCP HTTP server binary.
lang-extras = [
  "dep:tree-sitter-scala", "dep:tree-sitter-zig", "dep:tree-sitter-solidity",
  "dep:tree-sitter-lua", "dep:tree-sitter-json", "dep:tree-sitter-yaml",
  "dep:tree-sitter-css", "dep:tree-sitter-html", "dep:tree-sitter-graphql",
  "dep:tree-sitter-proto", "dep:tree-sitter-c-sharp", "dep:tree-sitter-haskell",
  "dep:tree-sitter-elm", "dep:tree-sitter-ocaml", "dep:tree-sitter-fsharp",
  "dep:tree-sitter-erlang", "dep:tree-sitter-nim", "dep:tree-sitter-powershell",
  "dep:tree-sitter-crystal", "dep:tree-sitter-cuda", "dep:tree-sitter-hlsl",
  "dep:tree-sitter-glsl", "dep:tree-sitter-verilog", "dep:tree-sitter-systemverilog",
  "dep:tree-sitter-qsharp",
]

# Embedding-bench examples import `embeddings`-feature symbols; skip them when
# the feature is off so `cargo test`/`cargo build --examples` stay green.
[[example]]
name = "bench_embed_stress"
required-features = ["embeddings"]

[[example]]
name = "bench_embed_infer"
required-features = ["embeddings"]

[[example]]
name = "bench_fastembed_smoke"
required-features = ["embeddings"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# FR-PLG-1 `connect`: format-preserving TOML edits for ~/.codex/config.toml
toml_edit = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
glob = "0.3"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
rayon = "1.10"
pulldown-cmark = "0.12"
regex = "1"
once_cell = "1"
schemars = "0.8"
async-trait = "0.1"
dirs = "5"
# FR-LCACHE: L1 read cache in front of the Postgres backend for hot read paths.
moka = { version = "0.12", features = ["future"] }
argon2 = { version = "0.5", features = ["rand"] }
# OsRng for argon2 salt generation — password-hash re-exports rand_core 0.6,
# but OsRng needs the `getrandom` feature (the legacy embedded-db dep used to
# enable it).
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tree-sitter-kotlin-ng = "1.1.0"
which = "7"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
tar = "0.4"
flate2 = "1"
tempfile = "3"
rust-embed = "8"
ignore = "0.4.25"
similar = "3.1.0"
roxmltree = "0.20"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-r = "1.2.0"
tree-sitter = "0.26"
tree-sitter-perl = "1.1.2"
# US-CBM-B1 LSP bridge: protocol types + async client scaffolding
lsp-types = "0.97"
sysinfo = "0.32"

# Embedding retrieval stack (optional, behind `embeddings` feature).
# fastembed: in-process embedding inference AND cross-encoder reranking
#   via ONNX Runtime. Covers BGE-small-en-v1.5 (embed) + bge-reranker-v2-m3 (rerank).
fastembed = { version = "4", optional = true }
# FR-EMBED-FAST: ort + tokenizers are direct deps (not just transitive via
# fastembed) so we can construct custom ONNX sessions with controlled
# intra_threads (fastembed 4.9.1 hardcodes `intra_threads = available_parallelism()`
# which on 10c hosts makes N worker sessions = 10N oversubscribed threads,
# capping throughput at ~120 vec/sec). See src/embeddings/models.rs
# `DirectEmbedder` for the alternative path that lifts this cap.
ort = { version = "2.0.0-rc.9", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
tree-sitter-solidity = { version = "1.2.13", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-graphql = { version = "0.1.0", optional = true }
tree-sitter-proto = { version = "0.4.0", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-elm = { version = "5.9.4", optional = true }
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-fsharp = { version = "0.3.11", optional = true }
tree-sitter-erlang = { version = "0.20.0", optional = true }
tree-sitter-nim = { version = "0.1.0", optional = true }
tree-sitter-powershell = { version = "0.26.4", optional = true }
tree-sitter-cuda = { version = "0.21", optional = true }
tree-sitter-hlsl = { version = "0.2", optional = true }
tree-sitter-glsl = { version = "0.2", optional = true }
tree-sitter-verilog = { version = "1.0", optional = true }
tree-sitter-systemverilog = { version = "0.4", optional = true }
tree-sitter-qsharp = { version = "0.2", optional = true }
tree-sitter-crystal = { version = "0.1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
chrono = "0.4"
notify = "7"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.4.0", features = ["server", "transport-io"] }
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-swift = "0.7"
tree-sitter-objc = "3.0"

# Bounded MPMC channel used by the embed pipeline to keep N inference
# workers and a single Postgres writer decoupled. Without this, N workers
# contending for the write lock serialized the Datalog :put
# path and throughput collapsed to ~40 vectors/sec.
crossbeam-channel = "0.5"
moka = { version = "0.12", features = ["future"] }

# PostgreSQL client for the pg backend (plan D1 nominates sqlx; translator
# phase picks the client — keeping postgres 0.19 which the Phase 0 spike
# already uses, so no new dependency is added for Phase 2).
# `with-serde_json-1` gives `postgres::types::Json<T>` + `serde_json::Value`
# ToSql/FromSql for the JSONB columns (metadata/tags/members/...).
postgres = { version = "0.19", features = ["with-serde_json-1"] }
# TLS for remote managed Postgres (Aiven/Neon/...). `postgres-rustls` gives
# `MakeTlsConnector` for the sync `postgres` client; rustls-pemfile loads the
# private CA cert from `LEANKG_PG_CA_CERT`. Only active when a CA cert is set —
# local dev PG on :5433 stays NoTls.
postgres_rustls = "0.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-postgres = { version = "0.7", default-features = false }
# Mozilla root store for `sslmode=verify-*` TLS URLs without a private CA
# (public CAs like Let's Encrypt). Already in the tree via reqwest/hyper-rustls.
webpki-roots = "1.0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
