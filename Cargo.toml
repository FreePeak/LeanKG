[package]
name = "leankg"
version = "0.19.32"
edition = "2021"
description = "Lightweight Knowledge Graph for AI-Assisted Development"
license = "Apache-2.0"
repository = "https://github.com/FreePeak/LeanKG"
homepage = "https://github.com/FreePeak/LeanKG"
documentation = "https://github.com/FreePeak/LeanKG"
readme = "README.md"
keywords = ["knowledge-graph", "ai"]
categories = ["command-line-utilities", "data-structures"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Enable vector retrieval + cross-encoder rerank + adaptive KG traversal.
# Adds fastembed (embedding + reranker inference via ONNX). Vectors are stored
# in CozoDB's native HNSW index on `embedding_vectors` (no extra deps).
# Off by default to keep the default binary slim.
embeddings = ["dep:fastembed", "dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
glob = "0.3"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
blake3 = "1"
rayon = "1.10"
pulldown-cmark = "0.12"
regex = "1"
once_cell = "1"
schemars = "0.8"
async-trait = "0.1"
dirs = "5"
# FR-LCACHE: L1 read cache in front of CozoDB for hot read paths.
moka = { version = "0.12", features = ["future"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tree-sitter-kotlin-ng = "1.1.0"
which = "7"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "json"], default-features = false }
tar = "0.4"
flate2 = "1"
tempfile = "3"
rust-embed = "8"
ignore = "0.4.25"
similar = "3.1.0"
roxmltree = "0.20"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-r = "1.2.0"
tree-sitter = "0.26"
tree-sitter-perl = "1.1.2"
# US-CBM-B1 LSP bridge: protocol types + async client scaffolding
lsp-types = "0.97"
sysinfo = "0.32"

# Embedding retrieval stack (optional, behind `embeddings` feature).
# fastembed: in-process embedding inference AND cross-encoder reranking
#   via ONNX Runtime. Covers BGE-small-en-v1.5 (embed) + bge-reranker-v2-m3 (rerank).
fastembed = { version = "4", optional = true }
# FR-EMBED-FAST: ort + tokenizers are direct deps (not just transitive via
# fastembed) so we can construct custom ONNX sessions with controlled
# intra_threads (fastembed 4.9.1 hardcodes `intra_threads = available_parallelism()`
# which on 10c hosts makes N worker sessions = 10N oversubscribed threads,
# capping throughput at ~120 vec/sec). See src/embeddings/models.rs
# `DirectEmbedder` for the alternative path that lifts this cap.
ort = { version = "2.0.0-rc.9", optional = true }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-scala = "0.26.0"
tree-sitter-zig = "1.1.2"
tree-sitter-solidity = "1.2.13"
tree-sitter-lua = "0.5.0"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-graphql = "0.1.0"
tree-sitter-proto = "0.4.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-haskell = "0.23.1"
tree-sitter-elm = "5.9.4"
tree-sitter-ocaml = "0.25.0"
tree-sitter-fsharp = "0.3.11"
tree-sitter-erlang = "0.20.0"
tree-sitter-nim = "0.1.0"
tree-sitter-powershell = "0.26.4"
tree-sitter-v = "0.0.4"
tree-sitter-odin = "1.3"
tree-sitter-hare = "0.20"
tree-sitter-gleam = "1.0"
tree-sitter-agda = "1.3"
tree-sitter-cuda = "0.21"
tree-sitter-hlsl = "0.2"
tree-sitter-glsl = "0.2"
tree-sitter-verilog = "1.0"
tree-sitter-systemverilog = "0.4"
tree-sitter-qsharp = "0.2"
tree-sitter-fortran = "0.6"
tree-sitter-ada = "0.1"
tree-sitter-julia = "0.23"
tree-sitter-matlab = "1.3"
tree-sitter-sas = "0.4"
tree-sitter-jinja = "0.13"
tree-sitter-cairo = "0.0.1"
tree-sitter-func = "1.0"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-starlark = "1.3"
tree-sitter-groovy = "0.1"
tree-sitter-crystal = "0.1.0"
tree-sitter-toml = "0.20.0"
tree-sitter-dockerfile = "0.2.0"
tree-sitter-vhdl = "1.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.7"
cozo = { version = "0.7.6", features = ["storage-rocksdb"] }
notify = "7"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "1.4.0", features = ["server", "transport-io"] }
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-swift = "0.7"
tree-sitter-objc = "3.0"

# Bounded MPMC channel used by the embed pipeline to keep N inference
# workers and a single CozoDB writer decoupled. Without this, N workers
# contending for the CozoDB write Mutex serialized the Datalog :put
# path and throughput collapsed to ~40 vectors/sec.
crossbeam-channel = "0.5"
moka = { version = "0.12", features = ["future"] }

# Optional Redis HNSW vector side-store (LEANKG_EMBED_VECTOR_STORE=redis)
redis = { version = "0.27", features = ["aio", "tokio-comp"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Phase 0 spike only (tests/pg_phase0_spike.rs). The migration proper uses
# sqlx (plan D1) — this stays a dev-dependency through the spike, removed in
# Phase 2 when sqlx lands.
postgres = "0.19"

[[example]]
name = "bench_embed_stress"
required-features = ["embeddings"]

[[example]]
name = "bench_fastembed_smoke"
required-features = ["embeddings"]

[[example]]
name = "bench_embed_infer"
required-features = ["embeddings"]

[[example]]
name = "bench_redis_writer"
required-features = ["embeddings"]

[[bench]]
name = "vector_engine_ab"
harness = false

[[bench]]
name = "orchestrator_bench"
harness = false

[[bench]]
name = "orchestrator_real_bench"
harness = false

[[bench]]
name = "redundant_tool_overhead"
harness = false
