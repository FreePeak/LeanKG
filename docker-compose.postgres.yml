# LeanKG Postgres migration — Phase 0 spike DB (pgvector on Postgres 18).
# Separate project (`-p leankg-pg`) so it never collides with the production
# compose project (`leankg_default` network, leankg-leankg-1 / cozoserver).
# Host port 5433 -> container 5432: host 5432 stays free.
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: leankg-pg-phase0
    environment:
      POSTGRES_DB: leankg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leankg"]
      interval: 2s
      timeout: 3s
      retries: 15
