# Offline cold-embed job (Phase 8, plan D4): PostgreSQL is the only storage
# engine, so the MCP service can stay up while a one-shot full rebuild
# runs against PG. The single-writer dance (stop / run / start) is gone —
# PG handles concurrent connections.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.embed.yml \
#     --profile embed run --rm leankg-embed
#
# Default embed profile: quality (FP32, full 512-token window). For a fast
# cold embed, override LEANKG_EMBED_FAST=1 + LEANKG_EMBED_MAX_SEQ=128 (the
# INT8 path) — see docs/reports/embed-3-workspaces-2026-07-17.md.
# Prefer BACKGROUND=1 on the main MCP service for day-2 so MCP stays up during rebuild.

services:
  leankg-embed:
    profiles: ["embed"]
    # Same default as docker-compose.yml. Override via LEANKG_IMAGE
    # or docker-compose.override.yml (gitignored) for a local/custom tag.
    image: ${LEANKG_IMAGE:-freepeak/leankg:latest}
    pull_policy: ${LEANKG_PULL_POLICY:-missing}
    entrypoint: ["leankg"]
    # LEANKG_MCP_PROJECT selects which mounted root to embed (override per run).
    # Side mounts (e.g. /workspace-other) come from docker-compose.override.yml
    # under services.leankg-embed.volumes — same binds as the MCP service.
    # `--full`: paginated scan + type filter (avoids cold incremental
    # per-QN find_element stall on mega-graphs). workers=8 + 14g mem_limit
    # let INT8 sessions run flat-out under the 12g soft cap (FR-EMBED-PERF-15M;
    # see docs/validation/2026-08-03-leankg-mcp-validation.md).
    command:
      [
        "embed",
        "--wait",
        "--full",
        "--project",
        "${LEANKG_MCP_PROJECT:-/workspace}",
        "--workers",
        "8",
        "--batch-size",
        "64",
        "--types",
        "function,method",
      ]
    environment:
      LEANKG_PG_URL: postgresql://postgres:postgres@postgres:5432/leankg
      LEANKG_MCP_PROJECT: ${LEANKG_MCP_PROJECT:-/workspace}
      LEANKG_MMAP_SIZE: "67108864"
      # Quality default (FP32, 512-token window). Opt into the fast INT8
      # profile with LEANKG_EMBED_FAST=1 + LEANKG_EMBED_MAX_SEQ=128.
      # 12g soft cap → 8 workers × 350 MB + 900 MB base (~3.7 GB) fits
      # under 10800 MB (90% of 12000). No duty-cycling.
      LEANKG_EMBED_MAX_MB: "12000"
      OMP_NUM_THREADS: "1"
      RUST_LOG: leankg=info
    volumes:
      - leankg-pgdata:/var/lib/postgresql/data
      - leankg_models:/root/.cache/leankg
      # Primary project mount. Extra repos: docker-compose.override.yml →
      # services.leankg-embed.volumes (mirror services.leankg.volumes).
      - ${HOST_PROJECT_PATH:-./}:${CONTAINER_PROJECT_PATH:-/workspace}
    working_dir: ${CONTAINER_PROJECT_PATH:-/workspace}
    cpus: "10"
    mem_reservation: 4g
    mem_limit: 14g
    restart: "no"
